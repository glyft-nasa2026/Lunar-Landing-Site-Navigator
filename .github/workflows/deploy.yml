# Each push to main (every merged pull request) builds web/ and commits web/dist to the
# `deploy` branch. The homelab server behind the Cloudflare Tunnel pulls that branch on a timer
# and serves it at darksight.space. Nothing on the server is reachable from GitHub, and the repo
# holds no secrets for it.
#
# The deploy branch holds only built files, one commit per deploy, with the source commit in the
# message and in version.txt. It is never force-pushed. The branch rule covers main only.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One deploy at a time. A newer merge waits for the running one instead of cancelling it, so
# two runs never race to push the deploy branch.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web

      - name: Commit web/dist to the deploy branch
        env:
          SHA: ${{ github.sha }}
        run: |
          set -eu
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin deploy > /dev/null; then
            git fetch --depth 1 origin deploy
            git worktree add --detach out FETCH_HEAD
          else
            git worktree add --orphan -b deploy out
          fi
          find out -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a web/dist/. out/
          echo "$SHA" > out/version.txt
          git -C out add -A
          if git -C out diff --cached --quiet; then
            echo "Built site is unchanged; nothing to deploy."
            exit 0
          fi
          git -C out commit -q -m "Deploy $SHA"
          git -C out push origin HEAD:refs/heads/deploy
          echo "Deployed $SHA to the deploy branch."
